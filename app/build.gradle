plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Build outputs go outside the project folder when BB_BUILD_ROOT is set (OneDrive locks files in build folders)
def br = System.getenv('BB_BUILD_ROOT')
if (br) layout.buildDirectory = file("$br/app")

android {
    namespace 'com.brickbreaker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.brickbreaker'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3.0'
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'

    testImplementation 'junit:junit:4.13.2'
}
